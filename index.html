<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>رسالة خاصة إلى بنين ❤️</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 15px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1a0826, #4a0028, #11001c);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      color: white;
      text-align: center;
    }
    .card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 20px;
      border-radius: 24px;
      box-shadow: 0 8px 32px 0 rgba(255, 0, 128, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.15);
      width: 100%;
      max-width: 400px;
      z-index: 10;
      margin: auto;
    }
    h1 { color: #ff4d6d; font-size: 24px; margin: 0 0 5px 0; text-shadow: 0 0 10px #ff4d6d; }
    h3 { color: #ffb3c1; font-size: 15px; margin: 0 0 15px 0; font-weight: normal; }
    .images-container { display: flex; justify-content: center; align-items: center; gap: 12px; margin: 15px 0; }
    .images-container img {
      width: 110px; height: 110px; object-fit: cover; border-radius: 50%;
      border: 3px solid #ff4d6d; box-shadow: 0 0 12px rgba(255, 77, 109, 0.5);
    }
    .btn-action {
      background: linear-gradient(45deg, #ff4d6d, #ff758f);
      color: white; border: none; padding: 12px 25px; font-size: 16px; font-weight: bold;
      border-radius: 25px; cursor: pointer; box-shadow: 0 4px 15px rgba(255, 77, 109, 0.4);
      margin: 15px 0; width: 80%;
      transition: transform 0.2s;
    }
    .btn-action:active { transform: scale(0.95); }
    .message-box {
      font-size: 15px; line-height: 1.8; text-align: right;
      background: rgba(0, 0, 0, 0.25); padding: 15px; border-radius: 15px;
      margin: 15px 0; min-height: 80px; display: none; border-right: 3px solid #ff4d6d;
    }
    .timer {
      margin-top: 15px; font-size: 14px; font-weight: bold;
      background: rgba(0, 0, 0, 0.3); padding: 10px; border-radius: 12px;
      border: 1px solid rgba(255, 117, 143, 0.5); color: #ffe6e8;
    }
    .falling-item {
      position: fixed; top: -50px; font-size: 22px; animation: fall linear infinite;
      user-select: none; pointer-events: none; z-index: 1;
    }
    @keyframes fall {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(105vh) rotate(360deg); opacity: 0.2; }
    }
  </style>
</head>
<body>

  <!-- صوت أغنية Nezuko Kamado - Crazy But She's Mine -->
  <audio loop id="bg-music" preload="auto">
    <source src="https://files.catbox.moe/5z5s3k.mp3" type="audio/mpeg">
  </audio>

  <div class="card">
    <h1>❤️ إلى بنين ❤️</h1>
    <h3>📅 تعرفنا يوم الثلاثاء ❤️</h3>

    <div class="images-container">
      <img src="1000044289.jpg" alt="صورتك">
      <img src="1000044458.jpg" alt="صورة بنين">
    </div>

    <button class="btn-action" id="show-msg-btn" onclick="startTyping()">دوس هنا ❤️</button>

    <div class="message-box" id="message-box"></div>

    <div class="timer" id="timer">جاري حساب الوقت... ⏳</div>
  </div>

  <script>
    const fullMessage = "❤️🌹\n\nبنين...\n\nمن يوم الثلاثاء اللي تعرفنا بيه، وأنتِ صرتِ أجمل صدفة بحياتي.\n\nوجودج يخليني أبتسم بدون سبب، وكلامج يغيّر مزاجي للأحسن.\n\nيمكن الكلمات ما تكفي توصف مكانتج بقلبي، بس أحب تعرفين إنج شخص غالي عليّ كلش.\n\nأتمنى تبقين سعيدة دوم، وأشوف ابتسامتج بكل يوم.\n\nشكراً لأنج دخلتي حياتي، وشكراً لذاك الثلاثاء الجميل اللي جمعني بيج.\n\nأحبج هواي يا بنين. ❤️🌹";

    let charIndex = 0;
    let isTyping = false;

    function startTyping() {
      const music = document.getElementById('bg-music');
      music.play().catch(e => console.log(e));

      if (isTyping) return;
      isTyping = true;

      document.getElementById('show-msg-btn').style.display = 'none';
      const msgBox = document.getElementById('message-box');
      msgBox.style.display = 'block';

      function typeNextChar() {
        if (charIndex < fullMessage.length) {
          let char = fullMessage.charAt(charIndex);
          if (char === '\n') {
            msgBox.innerHTML += '<br>';
          } else {
            msgBox.innerHTML += char;
          }
          charIndex++;
          setTimeout(typeNextChar, 40);
        }
      }
      typeNextChar();
    }

    const items = ['💖', '🌹', '✨', '💕', '🌸', '⭐'];
    function createFallingItem() {
      const item = document.createElement('div');
      item.classList.add('falling-item');
      item.innerText = items[Math.floor(Math.random() * items.length)];
      item.style.left = Math.random() * 100 + 'vw';
      item.style.animationDuration = Math.random() * 3 + 3 + 's';
      item.style.fontSize = Math.random() * 10 + 15 + 'px';
      document.body.appendChild(item);
      setTimeout(() => { item.remove(); }, 6000);
    }
    setInterval(createFallingItem, 350);

    const startDate = new Date();
    startDate.setDate(startDate.getDate() - 7); 

    function updateTimer() {
      const now = new Date();
      const diff = now - startDate;
      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((diff / 1000 / 60) % 60);
      const seconds = Math.floor((diff / 1000) % 60);

      document.getElementById('timer').innerText = 
        `مرت ${days} أيام و ${hours} ساعة و ${minutes} دقيقة و ${seconds} ثانية على معرفتنا 💕`;
    }
    setInterval(updateTimer, 1000);
    updateTimer();
  </script>
</body>
</html>
