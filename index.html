<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رسالة خاصة ❤️</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#ff4d6d,#ff99ac);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
text-align:center;
overflow:hidden;
}

.card{
background:rgba(255,255,255,.15);
padding:30px;
border-radius:20px;
backdrop-filter:blur(8px);
max-width:350px;
}

h1{font-size:32px;}
p{font-size:20px;line-height:1.8;}

button{
margin-top:20px;
padding:12px 25px;
border:none;
border-radius:30px;
font-size:18px;
cursor:pointer;
background:white;
color:#ff4d6d;
}

#msg{
display:none;
margin-top:20px;
font-size:22px;
font-weight:bold;
}
</style>
</head>

<body>

<div class="card">
<h1>❤️ رسالة خاصة ❤️</h1>
<p>اضغطي الزر إذا حابة تعرفين شنو أريد أگولج.</p>

<button onclick="showMsg()">اضغطي هنا</button>

<div id="msg">
أحبج جدًا، ووجودج بحياتي هو أجمل شيء صار إلي. ❤️🌹
</div>
</div>

<script>
function showMsg(){
document.getElementById("msg").style.display="block";
}
</script>

</body>
</html>
